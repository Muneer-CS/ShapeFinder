[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shape-finder-api"
version = "0.1.0"
description = "Provider-neutral API foundation for stock chart similarity search"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shape_finder"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=shape_finder --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
# Protocol-only boundary modules contain no executable application behavior.
omit = ["*/core/market_data.py", "*/core/persistence.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shape_finder"]
